<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 محاكي شات مسارات وصل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }

        /* ═══ Login Screen ═══ */
        .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 24px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .login-card h1 { text-align: center; font-size: 28px; margin-bottom: 8px; background: linear-gradient(135deg, #00d2ff, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-card p { text-align: center; color: #8892b0; margin-bottom: 30px; font-size: 14px; }
        .user-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .user-btn { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border: 2px solid rgba(255,255,255,0.08); border-radius: 16px; background: rgba(255,255,255,0.03); cursor: pointer; transition: all 0.3s; }
        .user-btn:hover { border-color: #7b2ff7; background: rgba(123,47,247,0.1); transform: translateY(-2px); }
        .user-btn .avatar { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
        .user-btn .info { text-align: right; flex: 1; }
        .user-btn .info .name { font-weight: 700; font-size: 15px; }
        .user-btn .info .desc { font-size: 12px; color: #8892b0; margin-top: 2px; }
        .role-parent .avatar { background: linear-gradient(135deg, #00b894, #00cec9); }
        .role-driver .avatar { background: linear-gradient(135deg, #e17055, #d63031); }
        .role-supervisor .avatar { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .section-title { font-size: 13px; color: #636e72; margin: 20px 0 10px; padding-right: 5px; font-weight: 700; }

        /* ═══ Chat App Layout ═══ */
        .chat-app { display: none; height: 100vh; }
        .chat-app.active { display: flex; }

        /* Sidebar */
        .sidebar { width: 340px; background: #1a1a2e; border-left: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px 20px; background: linear-gradient(135deg, #16213e, #1a1a2e); border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sidebar-header .user-info { display: flex; align-items: center; gap: 12px; }
        .sidebar-header .user-info .avatar-sm { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .sidebar-header .user-info .name { font-weight: 700; font-size: 15px; }
        .sidebar-header .user-info .role-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: rgba(123,47,247,0.2); color: #a29bfe; }
        .logout-btn { margin-top: 10px; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; background: transparent; color: #e17055; cursor: pointer; font-family: inherit; font-size: 13px; width: 100%; transition: all 0.3s; }
        .logout-btn:hover { background: rgba(225,112,85,0.1); }
        .contacts-list { flex: 1; overflow-y: auto; padding: 10px; }
        .contact-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }
        .contact-item:hover, .contact-item.active { background: rgba(123,47,247,0.15); }
        .contact-item .avatar-sm { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .contact-item .contact-info { flex: 1; min-width: 0; text-align: right; }
        .contact-item .contact-info .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-item .contact-info .desc { font-size: 11px; color: #636e72; margin-top: 2px; }
        .contact-item .contact-info .last-msg { font-size: 12px; color: #8892b0; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-item .unread { background: #7b2ff7; color: #fff; font-size: 11px; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f0f1a; }
        .chat-header { padding: 16px 24px; background: #16213e; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 14px; }
        .chat-header .avatar-sm { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .chat-header .name { font-weight: 700; font-size: 16px; }
        .chat-header .status { font-size: 12px; color: #00b894; }
        .chat-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #636e72; }
        .chat-empty .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.3; }
        .chat-empty .text { font-size: 16px; }

        /* Messages */
        .messages-container { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; }
        .message-bubble { max-width: 70%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.6; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message-bubble.mine { background: linear-gradient(135deg, #7b2ff7, #6c5ce7); align-self: flex-end; border-bottom-left: 4px; }
        .message-bubble.theirs { background: #1e2a3a; align-self: flex-start; border-bottom-right: 4px; }
        .message-bubble .sender-name { font-size: 11px; color: #a29bfe; font-weight: 700; margin-bottom: 4px; }
        .message-bubble .time { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 4px; text-align: left; }
        .message-bubble.theirs .time { text-align: right; }

        /* Input */
        .message-input-area { padding: 16px 24px; background: #16213e; border-top: 1px solid rgba(255,255,255,0.06); }
        .message-input-area form { display: flex; gap: 12px; }
        .message-input-area input { flex: 1; padding: 14px 20px; border: 2px solid rgba(255,255,255,0.08); border-radius: 14px; background: rgba(255,255,255,0.05); color: #fff; font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .message-input-area input:focus { border-color: #7b2ff7; }
        .message-input-area button { padding: 14px 24px; border: none; border-radius: 14px; background: linear-gradient(135deg, #7b2ff7, #6c5ce7); color: #fff; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .message-input-area button:hover { transform: scale(1.05); }
        .message-input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Notification Toast */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: linear-gradient(135deg, #00b894, #00cec9); color: #fff; padding: 14px 24px; border-radius: 14px; font-weight: 700; font-size: 14px; z-index: 9999; transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); box-shadow: 0 10px 30px rgba(0,184,148,0.3); }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* Realtime badge */
        .realtime-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 11px; margin-top: 8px; }
        .realtime-badge.connected { background: rgba(0,184,148,0.15); color: #00b894; }
        .realtime-badge.disconnected { background: rgba(225,112,85,0.15); color: #e17055; }
        .realtime-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
        .realtime-badge.connected .dot { background: #00b894; animation: pulse 2s infinite; }
        .realtime-badge.disconnected .dot { background: #e17055; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h1>📱 محاكي شات مسارات وصل</h1>
            <p>اختر الشخصية التي تريد تسجيل الدخول بها لتجربة المحادثات</p>
            <div class="section-title">👨‍👩‍👧‍👦 أولياء الأمور</div>
            <div class="user-grid" id="parentsGrid"></div>
            <div class="section-title">🚐 السائقون</div>
            <div class="user-grid" id="driversGrid"></div>
            <div class="section-title">👩‍💼 المشرفات</div>
            <div class="user-grid" id="supervisorsGrid"></div>
        </div>
    </div>

    <!-- Chat App -->
    <div id="chatApp" class="chat-app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="avatar-sm" id="myAvatar"></div>
                    <div>
                        <div class="name" id="myName"></div>
                        <span class="role-badge" id="myRole"></span>
                        <div class="realtime-badge disconnected" id="realtimeBadge">
                            <span class="dot"></span>
                            <span id="realtimeText">غير متصل</span>
                        </div>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">🚪 تسجيل خروج</button>
            </div>
            <div class="contacts-list" id="contactsList">
                <div style="padding:40px 20px; text-align:center; color: #636e72;">⏳ جاري تحميل جهات الاتصال...</div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div id="chatEmpty" class="chat-empty">
                <div class="icon">💬</div>
                <div class="text">اختر جهة اتصال لبدء المحادثة</div>
            </div>
            <div id="chatView" style="display:none; flex:1; flex-direction:column;">
                <div class="chat-header">
                    <div class="avatar-sm" id="chatAvatar"></div>
                    <div>
                        <div class="name" id="chatName"></div>
                        <div class="status" id="chatStatus"></div>
                    </div>
                </div>
                <div class="messages-container" id="messagesContainer"></div>
                <div class="message-input-area">
                    <form onsubmit="sendMessage(event)">
                        <input type="text" id="messageInput" placeholder="✍️ اكتب رسالتك هنا..." autocomplete="off">
                        <button type="submit" id="sendBtn">إرسال ➤</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Reverb Echo -->
    <script src="https://cdn.jsdelivr.net/npm/pusher-js@8.3.0/dist/web/pusher.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/laravel-echo@1.16.1/dist/echo.iife.js"></script>

    <script>
    // ═══════════════════════════════════════════════════════════
    //  Global State
    // ═══════════════════════════════════════════════════════════
    const API_BASE = 'http://127.0.0.1:8000/api/chat';
    let currentToken = null;
    let currentUser = null;
    let contacts = [];
    let activeConversation = null;
    let activeContactId = null;
    let echoInstance = null;
    let subscribedChannels = [];

    // ═══════════════════════════════════════════════════════════
    //  Demo Users (loaded from server)
    // ═══════════════════════════════════════════════════════════
    const demoUsers = [];

    async function loadDemoUsers() {
        try {
            const res = await fetch('/chat-simulator/tokens', { headers: { Accept: 'application/json' } });
            const data = await res.json();
            data.forEach(u => demoUsers.push(u));
            renderLoginScreen();
        } catch(e) {
            console.error('Failed to load demo users', e);
        }
    }

    function renderLoginScreen() {
        const parents = demoUsers.filter(u => u.role === 'parent');
        const drivers = demoUsers.filter(u => u.role === 'driver');
        const supervisors = demoUsers.filter(u => u.role === 'supervisor');

        document.getElementById('parentsGrid').innerHTML = parents.map(u => userBtnHTML(u)).join('');
        document.getElementById('driversGrid').innerHTML = drivers.map(u => userBtnHTML(u)).join('');
        document.getElementById('supervisorsGrid').innerHTML = supervisors.map(u => userBtnHTML(u)).join('');
    }

    function userBtnHTML(u) {
        const emoji = u.role === 'parent' ? '👨‍👩‍👦' : u.role === 'driver' ? '🚐' : '👩‍💼';
        const roleLabel = u.role === 'parent' ? 'ولي أمر' : u.role === 'driver' ? 'سائق' : 'مشرفة';
        return `<div class="user-btn role-${u.role}" onclick="loginAs(${JSON.stringify(u).replace(/"/g, '&quot;')})">
            <div class="avatar">${emoji}</div>
            <div class="info">
                <div class="name">${u.name}</div>
                <div class="desc">${roleLabel} ${u.desc ? '- ' + u.desc : ''}</div>
            </div>
        </div>`;
    }

    // ═══════════════════════════════════════════════════════════
    //  Login / Logout
    // ═══════════════════════════════════════════════════════════
    async function loginAs(user) {
        currentToken = user.token;
        currentUser = user;

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('chatApp').classList.add('active');

        const emoji = user.role === 'parent' ? '👨‍👩‍👦' : user.role === 'driver' ? '🚐' : '👩‍💼';
        const roleLabel = user.role === 'parent' ? 'ولي أمر' : user.role === 'driver' ? 'سائق' : 'مشرفة';

        document.getElementById('myAvatar').textContent = emoji;
        document.getElementById('myAvatar').className = `avatar-sm`;
        document.getElementById('myAvatar').style.background = user.role === 'parent' ? 'linear-gradient(135deg, #00b894, #00cec9)' : user.role === 'driver' ? 'linear-gradient(135deg, #e17055, #d63031)' : 'linear-gradient(135deg, #a29bfe, #6c5ce7)';
        document.getElementById('myName').textContent = user.name;
        document.getElementById('myRole').textContent = roleLabel;

        await loadContacts();
        connectReverb();
    }

    function logout() {
        disconnectReverb();
        currentToken = null;
        currentUser = null;
        contacts = [];
        activeConversation = null;
        activeContactId = null;

        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('chatApp').classList.remove('active');
        document.getElementById('chatView').style.display = 'none';
        document.getElementById('chatEmpty').style.display = 'flex';
    }

    // ═══════════════════════════════════════════════════════════
    //  API Calls
    // ═══════════════════════════════════════════════════════════
    async function apiFetch(url, options = {}) {
        const res = await fetch(API_BASE + url, {
            ...options,
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${currentToken}`,
                ...(options.headers || {})
            },
            credentials: 'omit'
        });
        return res.json();
    }

    async function loadContacts() {
        const data = await apiFetch('/contacts');
        contacts = data.success ? data.data : [];
        renderContacts();
    }

    function renderContacts() {
        const el = document.getElementById('contactsList');
        if (contacts.length === 0) {
            el.innerHTML = '<div style="padding:40px 20px; text-align:center; color: #636e72;">لا توجد جهات اتصال 🤷</div>';
            return;
        }
        el.innerHTML = contacts.map(c => {
            const emoji = c.role === 'parent' ? '👨‍👩‍👦' : c.role === 'driver' ? '🚐' : '👩‍💼';
            const bg = c.role === 'parent' ? 'linear-gradient(135deg, #00b894, #00cec9)' : c.role === 'driver' ? 'linear-gradient(135deg, #e17055, #d63031)' : 'linear-gradient(135deg, #a29bfe, #6c5ce7)';
            return `<div class="contact-item ${activeContactId === c.id ? 'active' : ''}" onclick="openChat(${c.id})" id="contact-${c.id}">
                <div class="avatar-sm" style="background:${bg}">${emoji}</div>
                <div class="contact-info">
                    <div class="name">${c.name}</div>
                    ${c.chat_description ? `<div class="desc">📋 ${c.chat_description}</div>` : ''}
                    <div class="last-msg" id="lastMsg-${c.id}"></div>
                </div>
                <div class="unread" id="unread-${c.id}" style="display:none">0</div>
            </div>`;
        }).join('');
    }

    async function openChat(contactId) {
        activeContactId = contactId;
        const contact = contacts.find(c => c.id === contactId);
        if (!contact) return;

        // Highlight
        document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`contact-${contactId}`)?.classList.add('active');

        // Show chat view
        document.getElementById('chatEmpty').style.display = 'none';
        const chatView = document.getElementById('chatView');
        chatView.style.display = 'flex';

        // Header
        const emoji = contact.role === 'parent' ? '👨‍👩‍👦' : contact.role === 'driver' ? '🚐' : '👩‍💼';
        const bg = contact.role === 'parent' ? 'linear-gradient(135deg, #00b894, #00cec9)' : contact.role === 'driver' ? 'linear-gradient(135deg, #e17055, #d63031)' : 'linear-gradient(135deg, #a29bfe, #6c5ce7)';
        document.getElementById('chatAvatar').textContent = emoji;
        document.getElementById('chatAvatar').style.background = bg;
        document.getElementById('chatName').textContent = contact.name;
        document.getElementById('chatStatus').textContent = contact.chat_description || '';

        // Start / get conversation
        const convData = await apiFetch('/conversations', {
            method: 'POST',
            body: JSON.stringify({ receiver_id: contactId })
        });

        if (!convData.success) {
            showToast('❌ ' + (convData.message || 'خطأ'), true);
            return;
        }

        activeConversation = convData.data;

        // Subscribe to channel
        subscribeToConversation(activeConversation.id);

        // Load messages
        const msgsData = await apiFetch(`/conversations/${activeConversation.id}/messages`);
        const messages = msgsData.success ? (msgsData.data || []).reverse() : [];
        renderMessages(messages);

        // Mark as read
        await apiFetch(`/conversations/${activeConversation.id}/read`, { method: 'POST' });
        const unreadEl = document.getElementById(`unread-${contactId}`);
        if (unreadEl) unreadEl.style.display = 'none';

        document.getElementById('messageInput').focus();
    }

    function renderMessages(messages) {
        const container = document.getElementById('messagesContainer');
        container.innerHTML = messages.map(m => {
            const isMine = m.sender?.id === currentUser.id;
            const time = new Date(m.created_at).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            return `<div class="message-bubble ${isMine ? 'mine' : 'theirs'}">
                ${!isMine ? `<div class="sender-name">${m.sender?.name || ''}</div>` : ''}
                <div>${m.body}</div>
                <div class="time">${time}</div>
            </div>`;
        }).join('');
        container.scrollTop = container.scrollHeight;
    }

    function appendMessage(msg, isMine) {
        const container = document.getElementById('messagesContainer');
        const time = new Date(msg.created_at || new Date()).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
        const div = document.createElement('div');
        div.className = `message-bubble ${isMine ? 'mine' : 'theirs'}`;
        div.innerHTML = `${!isMine ? `<div class="sender-name">${msg.sender?.name || ''}</div>` : ''}
            <div>${msg.body}</div>
            <div class="time">${time}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const body = input.value.trim();
        if (!body || !activeConversation) return;

        input.value = '';

        // Optimistic UI
        appendMessage({ body, created_at: new Date().toISOString() }, true);

        const res = await apiFetch(`/conversations/${activeConversation.id}/messages`, {
            method: 'POST',
            body: JSON.stringify({ body: body, conversation_id: activeConversation.id })
        });

        if (!res.success) {
            showToast('❌ فشل إرسال الرسالة', true);
        }
    }

    // ═══════════════════════════════════════════════════════════
    //  Laravel Reverb (Real-time)
    // ═══════════════════════════════════════════════════════════
    function connectReverb() {
        try {
            echoInstance = new Echo({
                broadcaster: 'reverb',
                key: 'masarat-wasel-key',
                wsHost: '127.0.0.1',
                wsPort: 8080,
                wssPort: 8080,
                forceTLS: false,
                enabledTransports: ['ws'],
                authEndpoint: '/api/broadcasting/auth',
                auth: {
                    headers: {
                        Authorization: `Bearer ${currentToken}`,
                        Accept: 'application/json',
                    }
                }
            });

            // Connection status
            echoInstance.connector.pusher.connection.bind('connected', () => {
                const badge = document.getElementById('realtimeBadge');
                badge.className = 'realtime-badge connected';
                document.getElementById('realtimeText').textContent = 'متصل مباشرة 🟢';
            });

            echoInstance.connector.pusher.connection.bind('disconnected', () => {
                const badge = document.getElementById('realtimeBadge');
                badge.className = 'realtime-badge disconnected';
                document.getElementById('realtimeText').textContent = 'غير متصل';
            });

        } catch(e) {
            console.error('Reverb connection failed:', e);
            const badge = document.getElementById('realtimeBadge');
            badge.className = 'realtime-badge disconnected';
            document.getElementById('realtimeText').textContent = 'غير متصل (Reverb غير متاح)';
        }
    }

    function subscribeToConversation(convId) {
        if (!echoInstance) return;
        if (subscribedChannels.includes(convId)) return;

        try {
            echoInstance.private(`chat.conversation.${convId}`)
                .listen('.message.sent', (msg) => {
                    // New message from the other person
                    if (activeConversation && activeConversation.id === msg.conversation_id) {
                        if (msg.sender?.id !== currentUser.id) {
                            appendMessage(msg, false);
                            // Mark as read
                            apiFetch(`/conversations/${convId}/read`, { method: 'POST' });
                        }
                    } else {
                        // Show notification
                        showToast(`💬 رسالة جديدة من ${msg.sender?.name || 'غير معروف'}`);
                        const unreadEl = document.getElementById(`unread-${msg.sender?.id}`);
                        if (unreadEl) {
                            unreadEl.style.display = 'flex';
                            unreadEl.textContent = parseInt(unreadEl.textContent || '0') + 1;
                        }
                    }
                });

            subscribedChannels.push(convId);
        } catch(e) {
            console.error('Subscribe failed', e);
        }
    }

    function disconnectReverb() {
        if (echoInstance) {
            subscribedChannels.forEach(id => {
                echoInstance.leave(`chat.conversation.${id}`);
            });
            echoInstance.disconnect();
            echoInstance = null;
            subscribedChannels = [];
        }
    }

    // ═══════════════════════════════════════════════════════════
    //  Toast Notification
    // ═══════════════════════════════════════════════════════════
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = isError
            ? 'linear-gradient(135deg, #e17055, #d63031)'
            : 'linear-gradient(135deg, #00b894, #00cec9)';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ═══════════════════════════════════════════════════════════
    //  Init
    // ═══════════════════════════════════════════════════════════
    loadDemoUsers();
    </script>
</body>
